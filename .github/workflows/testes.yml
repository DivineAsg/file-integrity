name: Testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
